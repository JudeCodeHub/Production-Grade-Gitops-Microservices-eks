
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: cartservice
    spec:
      template:
        spec:
          containers:
            - name: server
              env:
              - name: REDIS_ADDR
                $patch: delete
              - name: ALLOYDB_PRIMARY_IP
                value: ALLOYDB_PRIMARY_IP_VAL
              - name: ALLOYDB_DATABASE_NAME
                value: ALLOYDB_CARTS_DATABASE_NAME_VAL
              - name: ALLOYDB_TABLE_NAME
                value: ALLOYDB_CARTS_TABLE_NAME_VAL
              - name: ALLOYDB_SECRET_NAME
                value: ALLOYDB_SECRET_NAME_VAL
              - name: PROJECT_ID
                value: PROJECT_ID_VAL
- patch: |-
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: cartservice
      annotations:
        iam.gke.io/gcp-service-account: ALLOYDB_USER_GSA_ID
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: productcatalogservice
    spec:
      template:
        spec:
          containers:
            - name: server
              env:
              - name: ALLOYDB_CLUSTER_NAME
                value: ALLOYDB_CLUSTER_NAME_VAL
              - name: ALLOYDB_INSTANCE_NAME
                value: ALLOYDB_INSTANCE_NAME_VAL
              - name: ALLOYDB_DATABASE_NAME
                value: ALLOYDB_PRODUCTS_DATABASE_NAME_VAL
              - name: ALLOYDB_TABLE_NAME
                value: ALLOYDB_PRODUCTS_TABLE_NAME_VAL
              - name: ALLOYDB_SECRET_NAME
                value: ALLOYDB_SECRET_NAME_VAL
              - name: PROJECT_ID
                value: PROJECT_ID_VAL
              - name: REGION
                value: REGION_VAL
- patch: |-
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: productcatalogservice
      annotations:
        iam.gke.io/gcp-service-account: ALLOYDB_USER_GSA_ID
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: redis-cart
    $patch: delete
- patch: |-
    apiVersion: v1
    kind: Service
    metadata:
      name: redis-cart
    $patch: delete
