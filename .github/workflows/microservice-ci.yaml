name: Microservice CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image name and build context
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ inputs.service }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "IMAGE_NAME=ghcr.io/${OWNER,,}/microservices-demo/${SERVICE}:v1.0.${RUN_NUMBER}" >> "$GITHUB_ENV"
          if [ -f "src/${SERVICE}/Dockerfile" ]; then
            echo "BUILD_CONTEXT=./src/${SERVICE}" >> "$GITHUB_ENV"
          else
            echo "BUILD_CONTEXT=./src/${SERVICE}/src" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          tags: ${{ env.IMAGE_NAME }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          severity: HIGH,CRITICAL
          exit-code: 0
          vuln-type: os,library

      - name: Push Image
        run: docker push "$IMAGE_NAME"
